[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crexi-realestate-scraper-api"
version = "0.1.0"
description = "Automated Commercial Real Estate Data Pipeline, ML Valuation Engine, and Search API"
authors = [{ name = "FDE Team" }]
requires-python = ">=3.9"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.23.2",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.6",
    "sqlalchemy>=2.0.23",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "scikit-learn>=1.3.2",
    "numpy>=1.26.2",
    "pandas>=2.1.3",
    "networkx>=3.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.25.1",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
